services:
  postgres:
    image: postgres:17
    container_name: project-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_api
      POSTGRES_PASSWORD: auth_api_dev
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: